<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Setup')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="page page-narrow">
<section class="setup-header">
<div class="setup-icon">&#128101;</div>
<h1>Who's Playing?</h1>
<p class="setup-subtitle">Add players for your session</p>
</section>
<div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
<form th:action="@{/session/start}" method="post" class="setup-form" id="setupForm">
<input type="hidden" name="categoryId" th:value="${category.id}" />
<div id="playersList" class="players-list">
<div class="player-row">
<span class="player-avatar" style="background: var(--player-1)">P</span>
<input type="text" name="players" placeholder="Player 1" class="player-input" />
<button type="button" class="player-remove" aria-label="Remove">&times;</button>
</div>
<div class="player-row">
<span class="player-avatar" style="background: var(--player-2)">P</span>
<input type="text" name="players" placeholder="Player 2" class="player-input" />
<button type="button" class="player-remove" aria-label="Remove">&times;</button>
</div>
</div>
<button type="button" id="addPlayerBtn" class="btn-add-player">+ Add Player</button>
<div class="setup-actions">
<button type="submit" class="btn btn-primary">Start Session</button>
<a th:href="@{/}" class="btn btn-ghost">&larr; Back</a>
</div>
</form>
</main>
<script>
(function () {
const colors = ['#8b5cf6', '#ec4899', '#06b6d4', '#f59e0b', '#10b981', '#ef4444'];
const list = document.getElementById('playersList');
const addBtn = document.getElementById('addPlayerBtn');
const form = document.getElementById('setupForm');
function refreshRows() {
const rows = list.querySelectorAll('.player-row');
rows.forEach((row, i) => {
row.querySelector('.player-input').placeholder = 'Player ' + (i + 1);
row.querySelector('.player-avatar').style.background = colors[i % colors.length];
});
}
list.addEventListener('click', (e) => {
if (e.target.classList.contains('player-remove')) {
if (list.querySelectorAll('.player-row').length > 1) {
e.target.closest('.player-row').remove();
refreshRows();
}
}
});
addBtn.addEventListener('click', () => {
const i = list.querySelectorAll('.player-row').length;
const row = document.createElement('div');
row.className = 'player-row';
row.innerHTML =
'<span class="player-avatar" style="background:' + colors[i % colors.length] + '">P</'<input type="text" name="players" placeholder="Player ' + (i + 1) + '" class="player-'<button type="button" class="player-remove" aria-label="Remove">&times;</button>';
list.appendChild(row);
});
form.addEventListener('submit', (e) => {
const inputs = list.querySelectorAll('.player-input');
let hasOne = false;
inputs.forEach((i) => { if (i.value.trim()) hasOne = true; });
if (!hasOne) {
    e.preventDefault();
alert('Please enter at least one player name.');
}
});
})();
</script>
</body>
</html>
