<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin Login')}"></head>
<body>

<nav class="navbar">
    <a th:href="@{/}" class="brand">
        <span class="brand-icon">💬</span>
        <span class="brand-text">Questions to Discuss</span>
    </a>
</nav>

<main class="login-page">
    <div class="login-card">
        <h1>Admin Login</h1>
        <p class="login-subtitle">Sign in to manage QTD content</p>

        <div th:if="${loginError}" class="alert alert-error" th:text="${loginError}"></div>
        <div th:if="${loginInfo}" class="alert alert-info" th:text="${loginInfo}"></div>

        <form th:action="@{/admin/login}" method="post" class="login-form">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" required
                   class="form-input" autofocus autocomplete="username" />

            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" required
                   class="form-input" autocomplete="current-password" />

            <button type="submit" class="btn btn-primary login-submit">Log in</button>
        </form>

    </div>
</main>

</body>
</html>
